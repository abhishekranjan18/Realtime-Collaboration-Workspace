<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Collaboration Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>📝</span> CollabSpace Workspace
        </h1>
        <div class="flex items-center gap-3">
            <span class="text-sm bg-green-500/20 text-green-300 border border-green-500/40 px-3 py-1 rounded-full flex items-center gap-2">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Live Sync
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-6 flex flex-col gap-4">
        <!-- Text Formatting Toolbar -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-wrap gap-2 items-center">
            <button onclick="formatDoc('bold')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded font-bold border border-gray-300">B</button>
            <button onclick="formatDoc('italic')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded italic border border-gray-300">I</button>
            <button onclick="formatDoc('underline')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded underline border border-gray-300">U</button>
            <div class="h-6 w-px bg-gray-300 mx-1"></div>
            <button onclick="formatDoc('justifyLeft')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded border border-gray-300">Left</button>
            <button onclick="formatDoc('justifyCenter')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded border border-gray-300">Center</button>
            <button onclick="formatDoc('justifyRight')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded border border-gray-300">Right</button>
        </div>

        <!-- Rich Text Editor Canvas -->
        <div id="editor" contenteditable="true" class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 min-h-[400px] focus:outline-none focus:ring-2 focus:ring-slate-500 text-lg leading-relaxed" placeholder="Start typing your collaborative notes here...">
            <h2>Welcome to Real-time Collaboration Workspace</h2>
            <p>Start typing here to test formatted text, notes, and dynamic real-time synchronization simulation.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
